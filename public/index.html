<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minimi Chat</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <button id="new-chat" type="button">+ New chat</button>
      <nav id="conv-list" aria-label="Conversations"></nav>
      <div id="model-info"></div>
    </aside>
    <main>
      <header id="topbar">
        <button id="toggle-sidebar" type="button" aria-label="Show conversations">☰</button>
        <h1 id="conv-title">New chat</h1>
      </header>
      <div id="banner" hidden></div>
      <section id="messages" aria-live="polite">
        <div id="empty">
          <h2>Ask anything. I search the web and remember our past chats.</h2>
          <div id="examples">
            <button type="button">What's new in Postgres hosting pricing this month?</button>
            <button type="button">Compare HubSpot, Pipedrive and Salesforce for a 20-person sales team</button>
            <button type="button">What did I ask you last week? Is your answer still correct today?</button>
          </div>
        </div>
      </section>
      <form id="composer">
        <textarea id="input" rows="1" placeholder="Message…" autocomplete="off" autofocus></textarea>
        <button id="send" type="submit" aria-label="Send">↑</button>
        <button id="stop" type="button" aria-label="Stop" hidden>■</button>
      </form>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
